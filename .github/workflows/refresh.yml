name: Refresh data
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
    - cron: '47 1 * * *'
    - cron: '47 2 * * *'
    - cron: '47 3 1 * *'
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [forecast, recent_rain, satellite, sources, onitsha_replay]
        default: forecast
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  refresh:
    if: inputs.product != 'onitsha_replay'
    concurrency: refresh-data-${{ inputs.product || github.event.schedule }}
    outputs:
      product: ${{ steps.product.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      EE_PROJECT: manifest-ivy-453612-b3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose product
        id: product
        env:
          REQUESTED: ${{ inputs.product }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          product="$REQUESTED"
          if [ -z "$product" ]; then
            case "$SCHEDULE" in
              '17 0,6,12,18 * * *') product=forecast ;;
              '47 1 * * *') product=recent_rain ;;
              '47 2 * * *') product=satellite ;;
              '47 3 1 * *') product=sources ;;
              *) exit 1 ;;
            esac
          fi
          echo "name=$product" >> "$GITHUB_OUTPUT"
      - run: python -m pip install requests numpy rasterio earthengine-api
      - name: Authenticate Earth Engine
        if: steps.product.outputs.name == 'satellite'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EE_SERVICE_ACCOUNT }}
      - name: Restore prior successful snapshot
        env:
          PRODUCT: ${{ steps.product.outputs.name }}
        run: |
          python -m jobs.refresh_archive --repository "$GITHUB_REPOSITORY" --kind "$PRODUCT"
          if [ "$PRODUCT" = recent_rain ]; then
            python -m jobs.refresh_archive --repository "$GITHUB_REPOSITORY" --kind forecast
          fi
      - name: Acquire and validate
        env:
          PRODUCT: ${{ steps.product.outputs.name }}
        run: python -m jobs.refresh "$PRODUCT" --project "$EE_PROJECT"
      - name: Publish durable snapshot
        env:
          PRODUCT: ${{ steps.product.outputs.name }}
        run: |
          python - "$PRODUCT" <<'PY'
          import json,sys,zipfile
          from pathlib import Path
          root=Path('data/refresh');kind=sys.argv[1]
          latest=root/kind/'latest.json'
          entry=json.loads(latest.read_text())
          with zipfile.ZipFile('snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in [latest,root/kind/'attempt.json',*(root/entry['snapshot']).rglob('*')]:
                  if p.is_file() and p.name!='batch.lock': z.write(p,p.relative_to(root))
          PY
          tag="refresh-$PRODUCT-$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" snapshot.zip --target "$GITHUB_SHA" --prerelease --title "$PRODUCT snapshot" --notes 'Timestamped research inputs. See the archived summary for coverage and validity.'
      - name: Record freshness
        if: always()
        run: python -m jobs.refresh status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/refresh/status.json
            data/refresh/*/attempt.json
          retention-days: 30

  water-maps:
    needs: refresh
    if: needs.refresh.outputs.product == 'satellite'
    concurrency: water-maps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EE_SERVICE_ACCOUNT }}
      - run: python -m pip install numpy rasterio requests earthengine-api onnxruntime
      - name: Restore inventory and run frozen model
        run: |
          gh release download model-m1-s1-fp32 -p m1_s1_fp32.onnx -D reports/m1-s1-kaggle-365653491/onnx_fp32
          python -m jobs.refresh_archive --repository "$GITHUB_REPOSITORY" --kind satellite
          inventory=$(jq -r .snapshot data/refresh/satellite/latest.json)
          python -m jobs.radar_maps "data/refresh/$inventory/scenes.json" --project manifest-ivy-453612-b3

  onitsha-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.product == 'onitsha_replay'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.EE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.EE_SERVICE_ACCOUNT }}
      - run: python -m pip install numpy rasterio shapely requests earthengine-api onnxruntime
      - name: Acquire pinned study inputs
        run: |
          mkdir -p data/boundaries
          curl -fLsS --retry 3 "https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/NGA/ADM2/geoBoundaries-NGA-ADM2.geojson" -o data/boundaries/nga_adm2_verified.geojson
          mkdir -p data/predictions/onitsha_south_cohort/reference
          unzip -oq data/cases/onitsha_occurrence.zip -d data/predictions/onitsha_south_cohort/reference
          gh release download model-m1-s1-fp32 -p m1_s1_fp32.onnx -D reports/m1-s1-kaggle-365653491/onnx_fp32
      - name: Generate radar targets and evaluate fixed baselines
        run: |
          python -u -m jobs.onitsha_cohort --project manifest-ivy-453612-b3
          python -u -m jobs.onitsha_baseline --project manifest-ivy-453612-b3
      - uses: actions/upload-artifact@v4
        with:
          name: onitsha-replay
          path: reports/satellite_replay/onitsha*
