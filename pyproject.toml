[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodrisk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "segmentation-models-pytorch",
    "rasterio",
    "albumentations",
    "pandas",
]

[tool.setuptools.packages.find]
include = ["floodrisk*"]